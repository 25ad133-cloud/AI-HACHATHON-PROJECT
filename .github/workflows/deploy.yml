name: Build and Deploy to Render

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build and Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Validate Java Backend Compile Status
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile Backend
        run: |
          mkdir -p backend/bin
          find backend/src -name "*.java" > backend/sources.txt
          javac -encoding UTF-8 -d backend/bin -cp "backend/bin:backend/lib/*" @backend/sources.txt
        shell: bash

      # 2. Validate React Frontend Build Status
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Frontend Production Assets
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: https://dummy-backend-url.onrender.com # Place-holder during validation build

  deploy:
    name: Trigger Render Deployment
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Trigger Backend Render Hook
        if: env.HAS_BACKEND_HOOK == 'true'
        run: curl -s -X GET "${{ secrets.RENDER_BACKEND_HOOK }}"
        env:
          HAS_BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_HOOK != '' }}

      - name: Trigger Frontend Render Hook
        if: env.HAS_FRONTEND_HOOK == 'true'
        run: curl -s -X GET "${{ secrets.RENDER_FRONTEND_HOOK }}"
        env:
          HAS_FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_HOOK != '' }}
